global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: flask-app
    metrics_path: /metrics
    static_configs:
      # Nom du service Compose : "localhost" désignerait le conteneur Prometheus lui-même
      - targets: ["web:5000"]
